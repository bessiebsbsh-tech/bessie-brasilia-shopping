<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Bessie Beauty Club | Brasília Shopping</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #fff;
            color: #333;
            line-height: 1.6;
        }

        .hero {
            height: 100vh;
            background:
                linear-gradient(rgba(0, 0, 0, .45), rgba(0, 0, 0, .45)),
                url('./img/fachada.jpg');
            background-size: cover;
            background-position: center;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: white;
            padding: 20px;
        }

        .hero-content {
            max-width: 800px;
        }

        .hero h1 {
            font-size: 3rem;
            margin-bottom: 20px;
        }

        .hero p {
            font-size: 1.2rem;
            margin-bottom: 30px;
        }

        .btn {
            display: inline-block;
            padding: 15px 30px;
            border-radius: 50px;
            text-decoration: none;
            margin: 10px;
            font-weight: bold;
            transition: .3s;
        }

        .btn:hover {
            transform: translateY(-2px);
        }

        .btn-primary {
            background: #e5677a;
            color: white;
        }

        .btn-secondary {
            background: white;
            color: #333;
        }

        .section {
            padding: 80px 20px;
            max-width: 1200px;
            margin: auto;
        }

        .section h2 {
            text-align: center;
            margin-bottom: 40px;
            color: #333;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .gallery img {
            width: 100%;
            border-radius: 16px;
            height: 300px;
            object-fit: cover;
        }

        .benefits {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .card {
            padding: 30px;
            background: #f8f8f8;
            border-radius: 16px;
            text-align: center;
            font-size: 1.1rem;
            font-weight: bold;
        }

        .cta {
            background: #fdf0f3;
            text-align: center;
            padding: 80px 20px;
        }

        .cta p {
            max-width: 700px;
            margin: 20px auto;
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 30px;
        }

        footer p {
            margin: 6px 0;
        }

        @media(max-width:768px) {

            .hero h1 {
                font-size: 2rem;
            }

            .hero p {
                font-size: 1rem;
            }

            .btn {
                display: block;
                width: 100%;
                max-width: 320px;
                margin: 10px auto;
            }
        }
    </style>
</head>

<body>

    <section class="hero">

        <div class="hero-content">

            <h1>A Bessie Beauty Club está chegando ao Brasília Shopping</h1>

            <p>
                Uma nova experiência em beleza, bem-estar e autocuidado está sendo preparada para você.
                Cadastre-se para receber novidades, benefícios exclusivos e informações sobre nossa inauguração.
            </p>

            <a
